# Render Blueprint: one web service that runs the Express API and serves the built React app
services:
  - type: web
    name: contractor-supplier
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/getEquipment
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
